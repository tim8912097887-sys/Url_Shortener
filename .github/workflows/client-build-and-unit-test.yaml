name: Client-Build-And-Lint-And-Unit-Test
on:
  pull_request:
    branches:
      - main
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths:
      - "client/**"
      - ".github/workflows/client.yaml"
jobs:
  build-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1
          standalone: true
      - name: Set up Node.js with version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "./client/pnpm-lock.yaml"
      - name: Install Dependencies
        run: pnpm install
      - name: Run Build
        run: pnpm run build
  lint-and-unit-test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1
          standalone: true
      - name: Set up Node.js with version 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "./client/pnpm-lock.yaml"
      - name: Install Dependencies
        run: pnpm install
      - name: Run Lint
        run: pnpm run lint
      - name: Run Unit Test
        run: pnpm run test
